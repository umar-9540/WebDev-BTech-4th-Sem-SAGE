<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <style>
      .parent {
        border: 2px solid black;
        padding: 10px;
        padding: 10px 200px;
        /* Top -> Right -> Bottom -> Left */
        padding: 10px 20px 30px 40px;
        margin: 20px;
      }

      .child {
        width: 100px;
        height: 100px;
        background-color: red;
      }

      .child:hover {
        background-color: green;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child"></div>
    </div>
  </body>
</html>
