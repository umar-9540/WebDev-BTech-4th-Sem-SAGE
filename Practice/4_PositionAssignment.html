<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      nav {
        height: 40px;
        background-color: cyan;
        text-align: center;
      }

      .container {
        height: 70vh;
        background-color: lightpink;
        margin-top: 30px;
        position: relative;
      }

      button {
        height: 45px;
        width: 95px;
        border-radius: 50px;
        position: absolute;
      }

      #button1 {
        top: 30px;
        left: 30px;
      }

      #button2 {
        top: 30px;
        right: 30px;
      }

      #button3 {
        top: 45%;
        left: 45%;
      }

      #button4 {
        bottom: 30px;
        left: 30px;
      }

      #button5 {
        bottom: 30px;
        right: 30px;
      }
    </style>
  </head>
  <body>
    <nav>NAVBAR</nav>

    <div class="container">
      <button id="button1">A</button>
      <button id="button2">B</button>
      <button id="button3">C</button>
      <button id="button4">D</button>
      <button id="button5">E</button>
    </div>
  </body>
</html>
