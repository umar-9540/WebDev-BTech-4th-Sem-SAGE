<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Todo App</title>
  </head>
  <body>
    <h1>Todo App</h1>

    <form action="submit" id="form">
      <input type="hidden" id="todoId" />
      <input id="title-input" type="text" placeholder="Write a Todo" required />
      <button type="submit" id="add-btn">Add Todo</button>
      <button type="button" id="cancel" style="display: none;"">Cancel</button>
    </form>

    <div id="todo-list">
      <!-- Todos will be added by javascript -->
    </div>

    <script src="script.js"></script>
  </body>
</html>
